name: Plugin validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Marketplace synchronization and plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all marketplace manifests are synchronized
        run: python build/validate_plugin.py --check
      - name: Test auth and routing helper
        run: python -m unittest discover -s tests -p "test_*.py"
  validate-windows:
    name: Windows marketplace synchronization
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all marketplace manifests are synchronized
        run: python build/validate_plugin.py --check
