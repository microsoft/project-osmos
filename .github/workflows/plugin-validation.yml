name: Plugin validation

on:
  pull_request:
    branches: [main, master, public]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Marketplace synchronization and plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify all marketplace manifests are synchronized
        run: python build/validate_plugin.py --check
      - name: Test migration contract and package safeguards
        run: python -m unittest discover -s tests -p "test_*.py"
  validate-windows:
    name: Windows marketplace synchronization
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify all marketplace manifests are synchronized
        run: python build/validate_plugin.py --check
