name: Public safety review

on:
  pull_request:
    branches: [public]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-marketplace-sync:
    name: Public marketplace synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify all marketplace manifests are synchronized
        run: python build/validate_plugin.py --check
      - name: Verify public content and installation README
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          grep -F "microsoft/project-osmos" README.md >/dev/null

          controller_denylist=".github/""public/denylist.txt"
          denylist="$RUNNER_TEMP/public-denylist.txt"
          patterns="$RUNNER_TEMP/public-denylist-patterns.txt"
          git fetch --no-tags --depth=1 origin main
          git show "FETCH_HEAD:${controller_denylist}" >"$denylist"
          grep -Ev '^[[:space:]]*($|#)' "$denylist" >"$patterns" || true

          if [ -s "$patterns" ]; then
            if matches="$(git grep -I -n -i -E -f "$patterns" -- .)"; then
              echo "::error::Denylisted content remains in the public tree."
              printf '%s\n' "$matches"
              exit 1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "::error::Public denylist scan failed with status ${status}."
                exit "$status"
              fi
            fi
          fi

          internal_open="<""internal>"
          internal_close="</""internal>"
          for marker in "$internal_open" "$internal_close"; do
            if matches="$(git grep -I -n -i -F "$marker" -- .)"; then
              echo "::error::Internal block delimiters remain in the public tree."
              printf '%s\n' "$matches"
              exit 1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "::error::Internal marker scan failed with status ${status}."
                exit "$status"
              fi
            fi
          done

  request-ai-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Copilot public-safety review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pull = context.payload.pull_request;
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                reviewers: ['copilot'],
              });
              core.info('Requested GitHub Copilot public-safety review.');
            } catch (error) {
              core.warning(`Could not request Copilot review: ${error.message}`);
            }
