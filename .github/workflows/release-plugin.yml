name: Release plugin

on:
  push:
    branches: [main]
    paths:
      - ".github/plugin/marketplace.json"
  workflow_dispatch:

concurrency:
  group: release-plugin-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify all marketplace manifests are synchronized
        run: python build/validate_plugin.py --check

      - name: Publish immutable marketplace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python build/release_plugin.py --commit "$GITHUB_SHA" \
            --migration-note "The former standalone project-osmos execution skill is retired and removed. Use the project-osmos skill from microsoft/skills-for-fabric (fabric-skills@fabric-collection). Read README.md for source-specific installation and active-task precautions before updating or removing an older installation."
