name: Version bump check

on:
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  version-bump:
    name: Version bump check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Fetch base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}:refs/remotes/origin/pr-base"

      - name: Check marketplace version bump
        id: version_bump
        env:
          BASE_REF: refs/remotes/origin/pr-base
          CURRENT_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          args=(--base-ref "${BASE_REF}" --warning-only)
          if [[ "${HEAD_REPOSITORY}" == "${CURRENT_REPOSITORY}" ]]; then
            case "${BASE_BRANCH}:${HEAD_REF}" in
              main:automation/publish-project-osmos-*|public:automation/sync-public-from-main-*)
                args+=(--allow-version-skip)
                ;;
            esac
          fi
          python build/check_version_bump.py "${args[@]}"

      - name: Publish neutral version bump warning
        if: steps.version_bump.outputs.version_bumped == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        continue-on-error: true
        env:
          WARNING_MESSAGE: ${{ steps.version_bump.outputs.warning_message }}
        with:
          script: |
            const pull = context.payload.pull_request;
            const message = process.env.WARNING_MESSAGE;
            const detailsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Version bump warning',
              head_sha: pull.head.sha,
              details_url: detailsUrl,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Marketplace version not bumped',
                summary: message,
                annotations: [
                  {
                    path: '.github/plugin/marketplace.json',
                    start_line: 1,
                    end_line: 1,
                    annotation_level: 'warning',
                    title: 'Marketplace version not bumped',
                    message,
                  },
                ],
              },
            });
