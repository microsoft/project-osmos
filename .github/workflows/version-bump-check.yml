name: Version bump check

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-bump:
    name: Version bump check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Fetch base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}:refs/remotes/origin/pr-base"

      - name: Check marketplace version bump
        env:
          BASE_REF: refs/remotes/origin/pr-base
          CURRENT_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          args=(--base-ref "${BASE_REF}")
          if [[ "${HEAD_REPOSITORY}" == "${CURRENT_REPOSITORY}" ]]; then
            case "${BASE_BRANCH}:${HEAD_REF}" in
              main:automation/publish-project-osmos-*|public:automation/sync-public-from-main-*)
                args+=(--allow-version-skip)
                ;;
            esac
          fi
          python build/check_version_bump.py "${args[@]}"
